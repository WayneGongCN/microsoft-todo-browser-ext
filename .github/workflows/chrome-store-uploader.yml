name: Chrome Web Store
on:
  workflow_dispatch:
    inputs:
      action:
        description: Store operation
        type: choice
        default: status
        options: [status, upload, submit, release]
permissions:
  contents: read
jobs:
  store:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - if: inputs.action == 'upload' || inputs.action == 'submit'
        run: npm ci
      - if: inputs.action == 'upload' || inputs.action == 'submit'
        run: npm run check && npm run build:acceptance && npx playwright install --with-deps chromium && npm run test:e2e && npm run package
      - name: Run requested store operation
        env:
          CWS_REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          CWS_CLIENT_ID: ${{ vars.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          STORE_ACTION: ${{ inputs.action }}
        run: node scripts/store.mjs "$STORE_ACTION" .output/release/microsoft-todo-capture-2.0.0-chrome.zip
      - uses: actions/upload-artifact@v7
        if: always() && inputs.action == 'status'
        with:
          name: store-status
          path: .output/store-status.json
          if-no-files-found: ignore
